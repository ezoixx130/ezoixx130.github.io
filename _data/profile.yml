short_bio: >-
  <p>
    I am a Research Associate in the Medical Intelligence and Robotic Cognition (MIRoC) Lab in the
    Department of Mechanical Engineering at The University of Hong Kong, which I joined in September 2026.
  </p>
  <p>
    I graduated from Tsinghua University in July 2026 with a BEng in Computer Science
    and Technology at the Institute for Interdisciplinary Information Sciences (IIIS), Yao Class.
  </p>

  <p>
    My research interests lie at the intersection of robotics, computer vision, and medical AI. I aim to develop intelligent systems that connect perception and understanding with physical interaction for healthcare.
  </p>

